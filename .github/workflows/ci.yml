name: Validate Tidbyt App

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install original Tidbyt Pixlet
        shell: bash
        run: |
          set -euo pipefail
          version=0.34.0
          archive="pixlet_${version}_linux_amd64.tar.gz"
          tools="$RUNNER_TEMP/tidbyt-tools"
          mkdir -p "$tools"
          cd "$tools"
          curl --fail --location --retry 3 "https://github.com/tidbyt/pixlet/releases/download/v${version}/${archive}" -o "$archive"
          curl --fail --location --retry 3 "https://github.com/tidbyt/pixlet/releases/download/v${version}/checksums.txt" -o checksums.txt
          grep " ${archive}$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive"
          echo "$tools" >> "$GITHUB_PATH"
      - name: Install test dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Check formatting and lint
        shell: bash
        run: |
          set -euo pipefail
          pixlet version
          changes="$(pixlet format --dry-run apps/collettsbus/collettsbus.star scripts/logic_test.star)"
          if [ -n "$changes" ]; then printf '%s\n' "$changes"; exit 1; fi
          pixlet lint apps/collettsbus/collettsbus.star
      - name: Test logic and local upload safety
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Render all fixture states
        run: bash scripts/render_states.sh
      - name: Check rendered pixels and animation bounds
        run: python -c 'import sys; sys.path.insert(0, "scripts"); from render_designs import validate_states; validate_states()'
      - name: Check community publication requirements
        run: pixlet check apps/collettsbus
      - name: Upload preview artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tidbyt-previews
          path: apps/collettsbus/screenshots/
          retention-days: 14